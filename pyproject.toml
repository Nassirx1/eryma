[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eryma"
version = "0.3.0"
description = "Model-agnostic input and output security middleware"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.urls]
Homepage = "https://github.com/Nassirx1/eryma"
Repository = "https://github.com/Nassirx1/eryma"
Issues = "https://github.com/Nassirx1/eryma/issues"

[project.optional-dependencies]
http = ["httpx>=0.27,<1"]
jev = ["httpx>=0.27,<1"]
laya = ["laya==0.4.7"]
von = ["von-sdk==1.3.7; python_version >= '3.12'"]
mlx = ["laya-mlx==0.4.0; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.11'"]
huggingface = ["transformers>=4.41,<6", "torch>=2.2,<3", "sentencepiece>=0.2,<1"]
dev = ["pytest>=8,<10", "build>=1,<2", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["eryma*"]

[tool.setuptools.package-data]
eryma = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: opt-in real provider calls or local model weights"]
