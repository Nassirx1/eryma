<svg xmlns="http://www.w3.org/2000/svg" width="520" height="700" viewBox="0 0 520 700" role="img" aria-labelledby="title desc">
<title id="title">ERYMA decision states</title><desc id="desc">A disabled guard returns skipped and allow. Enabled guards validate scores, choose the unique maximum, apply optional thresholds, and aggregate check actions. Invalid scores, ties, and low confidence block by default. Flag allows with warning.</desc>
<rect width="520" height="700" rx="20" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#0f172a">
<text x="260" y="43" text-anchor="middle" font-size="27" font-weight="700">From scores to an action</text>
<rect x="30" y="70" width="460" height="65" rx="12" fill="#e2e8f0"/><text x="50" y="98" font-size="21" font-weight="700">Guard disabled → skipped</text><text x="50" y="123" font-size="17">ALLOW immediately; zero decision-model calls</text>
<text x="260" y="170" text-anchor="middle" font-size="20" font-weight="700">Enabled guard: evaluate each check</text>
<rect x="30" y="190" width="460" height="69" rx="12" fill="#fee2e2"/><text x="50" y="218" font-size="21" font-weight="700">Invalid / missing / failed → evaluation_error</text><text x="50" y="245" font-size="17">Default action: BLOCK</text>
<rect x="30" y="277" width="460" height="69" rx="12" fill="#fef3c7"/><text x="50" y="305" font-size="21" font-weight="700">Exact highest-score tie → tie</text><text x="50" y="332" font-size="17">No selected decision; default action: BLOCK</text>
<rect x="30" y="364" width="460" height="81" rx="12" fill="#fef3c7"/><text x="50" y="393" font-size="20" font-weight="700">Winner below threshold</text><text x="50" y="418" font-size="18">→ insufficient_confidence</text><text x="50" y="439" font-size="16">Keep the winner; default action: BLOCK</text>
<rect x="30" y="463" width="460" height="69" rx="12" fill="#dcfce7"/><text x="50" y="491" font-size="21" font-weight="700">Unique winner accepted → evaluated</text><text x="50" y="518" font-size="17">Use the developer's category-to-action mapping</text>
<text x="260" y="568" text-anchor="middle" font-size="21" font-weight="700">Combine all check actions</text>
<text x="260" y="600" text-anchor="middle" font-size="18">RAISE_ERROR → BLOCK → FLAG → ALLOW</text>
<text x="260" y="637" text-anchor="middle" font-size="18">FLAG = allow with warning</text>
<text x="260" y="674" text-anchor="middle" font-size="16">Thresholds default to None; policies are configurable</text>
</g></svg>
